version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nomadsync-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nomadsync
    networks:
      - nomadsync-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomadsync-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: nomadsync
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - mongodb
    networks:
      - nomadsync-network
    volumes:
      - ./backend:/app
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: nomadsync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nomadsync-network

volumes:
  mongodb_data:
    driver: local

networks:
  nomadsync-network:
    driver: bridge
